CONFIG_ZMK_KEYBOARD_NAME="mtk64"

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_PINCTRL=y

CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_MAX_CONN=8
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_AUTO_SEC_REQ=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
# CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# battery level percentage
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=50
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=20

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
# CONFIG_ZMK_DONGLE_DISPLAY_WPM=y
# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
# CONFIG_PROSPECTOR_LAYER_ROLLER_ALL_CAPS=n
# CONFIG_PROSPECTOR_PROSPECTOR_ROTATE_DISPLAY_180=n
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n

# Enable status advertisement
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="mtk64"
# Split keyboard only: enable peripheral battery fetching
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="RIGHT"
# ===== PERIPHERAL BATTERY MAPPING (v2.1, for multi-peripheral setups) =====
# Use when connection order doesn't match physical layout (e.g., after settings_reset)
## Right half (default: 1)
# CONFIG_ZMK_STATUS_ADV_CENTRAL=2
## Keyboard half slot (default: 0)
CONFIG_ZMK_STATUS_ADV_HALF_PERIPHERAL=2
## Aux1 slot - e.g., trackball (default: 1)
CONFIG_ZMK_STATUS_ADV_AUX1_PERIPHERAL=1
## Aux2 slot - e.g., numpad (default: 2)
CONFIG_ZMK_STATUS_ADV_AUX2_PERIPHERAL=0
# For multi-keyboard environments - filter by channel on scanner side
# CONFIG_PROSPECTOR_CHANNEL=0                   # 0=broadcast to all (default)
# 1-9=recommended (touch UI compatible)
CONFIG_PROSPECTOR_CHANNEL=6

# Indicate highest active layer with a constant configurable color per layer
#| Color        | Value |
#| ------------ | ----- |
#| Black (none) | `0`   |
#| Red          | `1`   |
#| Green        | `2`   |
#| Yellow       | `3`   |
#| Blue         | `4`   |
#| Magenta      | `5`   |
#| Cyan         | `6`   |
#| White        | `7`   |
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=7

